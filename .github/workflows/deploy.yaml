name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  verify-latest-main:
    runs-on: ubuntu-latest
    outputs:
      is_latest: ${{ steps.latest-main.outputs.is_latest }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify this deployment is latest main
        id: latest-main
        run: |
          if [ "${{ github.event_name }}" != "push" ] || [ "${{ github.ref }}" != "refs/heads/main" ]; then
            echo "is_latest=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          latest_sha="$(git ls-remote origin refs/heads/main | cut -f1)"
          if [ "$latest_sha" = "$GITHUB_SHA" ]; then
            echo "is_latest=true" >> "$GITHUB_OUTPUT"
          else
            echo "Skipping stale deploy for $GITHUB_SHA; latest main is $latest_sha."
            echo "is_latest=false" >> "$GITHUB_OUTPUT"
          fi

  deploy-backend:
    needs: verify-latest-main
    if: needs.verify-latest-main.outputs.is_latest == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      # The CLI is pinned: @latest let every deploy pick up whatever shipped
      # that day, so the pipeline's behaviour changed under us between runs.
      - name: Link Supabase project
        run: npx supabase@2.110.0 link --project-ref bdkaqgvzjkixwakzploq
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Apply Supabase migrations
        run: npx supabase@2.110.0 db push --linked
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      # --use-api bundles functions on Supabase's servers instead of in a local
      # Docker container. Without it the CLI pulls the edge-runtime image from
      # AWS public ECR, which rate-limits anonymous pulls per IP -- and GitHub's
      # shared runners regularly hit "toomanyrequests: Rate exceeded", which is
      # exactly how runs #173 and #174 failed on their first attempts. The retry
      # loop is a backstop for any other transient API failure.
      - name: Deploy Supabase Edge Functions
        run: |
          deploy() {
            local fn="$1"; shift
            local attempt
            for attempt in 1 2 3; do
              if npx supabase@2.110.0 functions deploy "$fn" --project-ref bdkaqgvzjkixwakzploq --use-api "$@"; then
                return 0
              fi
              echo "::warning::deploy of $fn failed (attempt $attempt of 3); retrying in $((attempt * 20))s"
              sleep $((attempt * 20))
            done
            echo "::error::deploy of $fn failed after 3 attempts"
            return 1
          }
          deploy create-checkout --no-verify-jwt
          deploy get-purchase --no-verify-jwt
          deploy get-admin-dashboard-data --no-verify-jwt
          deploy google-sheets-sync --no-verify-jwt
          deploy stripe-webhook --no-verify-jwt
          deploy send-waiver-email --no-verify-jwt
          deploy smartwaiver-webhook --no-verify-jwt
          deploy waiver-reconcile --no-verify-jwt
          deploy checkin-roster --no-verify-jwt
          deploy checkin-mark --no-verify-jwt
          deploy stripe-checkout
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

  build:
    needs: deploy-backend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build
        env:
          GITHUB_ACTIONS: "true" 
          VITE_SUPABASE_URL: https://bdkaqgvzjkixwakzploq.supabase.co
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs:
      - verify-latest-main
      - build
    if: needs.verify-latest-main.outputs.is_latest == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
